{% extends 'resources/base.html' %}

{% block title %}Login - Department Resource Sharing Portal{% endblock %}

{% block content %}
<div class="min-h-[80vh] flex flex-col justify-center items-center px-4 py-12">
  
  <!-- Login Card (Figure 6.2.2) -->
  <div class="w-full max-w-md bg-white rounded-xl shadow-lg border border-slate-200 overflow-hidden">
    
    <!-- Blue/Dark Admin/User Header -->
    <div id="loginHeader" class="bg-slate-700 py-3 px-6 text-white text-center font-bold text-lg flex items-center justify-center space-x-2">
      <span id="loginTitleText">User & Admin Login</span>
    </div>

    <div class="p-6 sm:p-8">

      <!-- Role Tabs (Admin / Faculty / Student) matching Chapter 4.1 Login Panel -->
      <div class="flex rounded-lg bg-slate-100 p-1 mb-6 text-xs font-semibold">
        <button type="button" onclick="setRole('student', 'Student Login', 'meghana-student', 'Student@123', 'bg-blue-600')" class="role-tab flex-1 py-1.5 rounded-md text-slate-700 transition" id="tabStudent">Student</button>
        <button type="button" onclick="setRole('faculty', 'Faculty Login', 'shruthi', 'Faculty@123', 'bg-indigo-600')" class="role-tab flex-1 py-1.5 rounded-md text-slate-700 transition" id="tabFaculty">Faculty</button>
        <button type="button" onclick="setRole('admin', 'Admin', 'apeksha', 'Admin@123', 'bg-slate-700')" class="role-tab flex-1 py-1.5 rounded-md bg-white shadow text-slate-900 transition" id="tabAdmin">Admin</button>
      </div>

      <form method="POST" action="{% url 'login' %}">
        {% csrf_token %}
        
        <div class="mb-4">
          <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">Username or Email</label>
          <input type="text" name="username" id="usernameInput" value="apeksha" required 
                 class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-lg text-sm text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition"
                 placeholder="Enter username or email">
        </div>

        <div class="mb-6">
          <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">Password</label>
          <input type="password" name="password" id="passwordInput" value="Admin@123" required 
                 class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-lg text-sm text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition"
                 placeholder="••••••••••••">
        </div>

        <button type="submit" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg text-sm shadow transition">
          Log in
        </button>
      </form>

      <!-- 1-Click Fast Credentials (from report & live site) -->
      <div class="mt-8 pt-6 border-t border-slate-200">
        <div class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-3">Instant 1-Click Fill:</div>
        <div class="grid grid-cols-2 gap-2 text-xs">
          <button type="button" onclick="fillCreds('apeksha', 'Admin@123', 'Admin')" class="p-2 border border-slate-200 rounded hover:bg-slate-50 text-left">
            <span class="font-bold text-slate-800">Apeksha</span><br><span class="text-slate-400">Admin</span>
          </button>
          <button type="button" onclick="fillCreds('shruthi', 'Faculty@123', 'Faculty Login')" class="p-2 border border-slate-200 rounded hover:bg-slate-50 text-left">
            <span class="font-bold text-slate-800">Shruthi</span><br><span class="text-slate-400">Faculty (ISE)</span>
          </button>
          <button type="button" onclick="fillCreds('meghana-student', 'Student@123', 'Student Login')" class="p-2 border border-slate-200 rounded hover:bg-slate-50 text-left">
            <span class="font-bold text-slate-800">Meghana</span><br><span class="text-slate-400">Student (Sem 6)</span>
          </button>
          <button type="button" onclick="fillCreds('anandababu@dept.edu', 'Admin@123', 'Admin')" class="p-2 border border-slate-200 rounded hover:bg-slate-50 text-left">
            <span class="font-bold text-slate-800">Dr. Ananda Babu</span><br><span class="text-slate-400">HOD & Prof</span>
          </button>
        </div>
      </div>

      <div class="mt-6 text-center text-xs text-slate-500">
        Don't have an account? <a href="{% url 'register' %}" class="text-blue-600 font-semibold hover:underline">Register here</a>
      </div>

    </div>
  </div>

</div>

<script>
  function setRole(role, title, username, password, bgClass) {
    document.querySelectorAll('.role-tab').forEach(t => {
      t.classList.remove('bg-white', 'shadow', 'text-slate-900');
      t.classList.add('text-slate-700');
    });
    if (role === 'student') document.getElementById('tabStudent').classList.add('bg-white', 'shadow', 'text-slate-900');
    if (role === 'faculty') document.getElementById('tabFaculty').classList.add('bg-white', 'shadow', 'text-slate-900');
    if (role === 'admin') document.getElementById('tabAdmin').classList.add('bg-white', 'shadow', 'text-slate-900');

    document.getElementById('loginTitleText').innerText = title;
    document.getElementById('usernameInput').value = username;
    document.getElementById('passwordInput').value = password;
  }

  function fillCreds(u, p, title) {
    document.getElementById('usernameInput').value = u;
    document.getElementById('passwordInput').value = p;
    document.getElementById('loginTitleText').innerText = title;
  }
</script>
{% endblock %}
