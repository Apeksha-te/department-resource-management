{% extends 'resources/base.html' %}

{% block title %}User Profile - Department Resource Sharing Portal{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto px-4 py-10">

  <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 sm:p-8">
    <div class="mb-6">
      <h1 class="text-2xl font-bold text-slate-900">User Profile</h1>
      <p class="text-xs text-slate-500 mt-1">Manage your account credentials, department designation, and password.</p>
    </div>

    <form method="POST" action="{% url 'profile' %}">
      {% csrf_token %}

      <div class="mb-4">
        <label class="block text-xs font-semibold text-slate-700 mb-1">Username</label>
        <input type="text" value="{{ user.username }}" disabled 
               class="w-full px-3.5 py-2.5 bg-slate-100 border border-slate-200 rounded-lg text-sm text-slate-500 cursor-not-allowed">
      </div>

      <div class="mb-4">
        <label class="block text-xs font-semibold text-slate-700 mb-1">Full Name</label>
        <input type="text" name="full_name" value="{{ profile.full_name|default:user.first_name }}"
               class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-lg text-sm text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white">
      </div>

      <div class="mb-4">
        <label class="block text-xs font-semibold text-slate-700 mb-1">Email</label>
        <input type="email" name="email" value="{{ user.email }}"
               class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-lg text-sm text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white">
      </div>

      <div class="grid grid-cols-2 gap-4 mb-4">
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Role</label>
          <input type="text" value="{% if profile.role == 'ROLE_ADMIN' %}Admin{% elif profile.role == 'ROLE_FACULTY' %}Faculty{% else %}Student{% endif %}" disabled
                 class="w-full px-3.5 py-2.5 bg-slate-100 border border-slate-200 rounded-lg text-sm text-slate-500 cursor-not-allowed">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">USN / Identifier</label>
          <input type="text" value="{{ profile.identifier }}" disabled
                 class="w-full px-3.5 py-2.5 bg-slate-100 border border-slate-200 rounded-lg text-sm text-slate-500 cursor-not-allowed">
        </div>
      </div>

      <div class="mb-6 pt-4 border-t border-slate-200">
        <label class="block text-xs font-semibold text-slate-700 mb-1">Change Password (leave blank to keep current)</label>
        <input type="password" name="password" 
               class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-lg text-sm text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-500"
               placeholder="New password">
      </div>

      <div class="flex items-center justify-end space-x-3">
        <a href="{% url 'dashboard' %}" class="px-4 py-2 text-xs border border-slate-300 text-slate-700 rounded-lg hover:bg-slate-50 font-medium">Back to Dashboard</a>
        <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold text-xs px-5 py-2.5 rounded-lg shadow transition">
          Save Changes
        </button>
      </div>
    </form>
  </div>

</div>
{% endblock %}
